name: Phase 3 Cloudflare verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloudflare-phase3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Preserve Phase 2 gate
        run: npm run verify:phase2
      - name: Phase 3 runtime and configuration tests
        run: npm run test:phase3
      - name: Generate Cloudflare binding types
        run: npm run cf:types
      - name: Verify generated types are current
        run: git diff --exit-code -- worker-configuration.d.ts
      - name: Cloudflare deploy dry run
        run: npm run cf:dry-run
      - name: Confirm no Phase 4 database bindings
        run: |
          if grep -E 'hyperdrive|d1_databases|database_id|DATABASE_URL|NEON' wrangler.jsonc; then
            echo "Phase 4 database configuration detected during Phase 3" >&2
            exit 1
          fi
      - name: Verify Cloudflare Git deployment live
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH="${GITHUB_HEAD_REF//\//-}"
            BASE_URL="https://${BRANCH}-my-budget.positivity864.workers.dev"
          else
            BASE_URL="https://my-budget.positivity864.workers.dev"
          fi

          echo "Verifying Cloudflare deployment at ${BASE_URL}"

          verify_endpoint() {
            local path="$1"
            local expected="$2"
            local body_file
            body_file="$(mktemp)"
            local code=""

            for attempt in $(seq 1 24); do
              code="$(curl --location --silent --show-error --output "$body_file" --write-out '%{http_code}' "${BASE_URL}${path}" || true)"
              if [ "$code" = "200" ] && grep -Fq "$expected" "$body_file"; then
                echo "PASS ${path} on attempt ${attempt}"
                rm -f "$body_file"
                return 0
              fi
              echo "Waiting for Cloudflare deployment: ${path} returned ${code} on attempt ${attempt}"
              sleep 10
            done

            echo "Cloudflare live verification failed for ${BASE_URL}${path}" >&2
            echo "Last HTTP status: ${code}" >&2
            cat "$body_file" >&2 || true
            rm -f "$body_file"
            return 1
          }

          verify_endpoint "/" "Every Cent"
          verify_endpoint "/health" '"phase":3'
          verify_endpoint "/ready" '"database":"not-configured-phase-4"'
