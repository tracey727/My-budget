name: Generate Budget Types Helper

on:
  push:
    branches:
      - cleanup/generate-budget-types-helper

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/generate-budget-types-helper
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:types
      - name: Commit generated types and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-budget-types-helper.yml
          git add worker-configuration.d.ts
          git commit -m "chore: refresh generated Cloudflare types"
          git push origin HEAD:cleanup/generate-budget-types-helper
