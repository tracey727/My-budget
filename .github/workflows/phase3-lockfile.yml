name: Phase 3 lockfile refresh

on:
  push:
    branches:
      - phase3-cloudflare-foundation

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase3-cloudflare-foundation
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Phase 3: refresh package lock for Wrangler"
            git push origin HEAD:phase3-cloudflare-foundation
          fi
