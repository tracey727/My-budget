name: Phase 3 generated files refresh

on:
  push:
    branches:
      - phase3-cloudflare-foundation

permissions:
  contents: write

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase3-cloudflare-foundation
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Cloudflare binding types
        run: npm run cf:types
      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json worker-configuration.d.ts
          if git diff --cached --quiet; then
            echo "Generated files already current"
          else
            git commit -m "Phase 3: refresh generated Cloudflare files"
            git push origin HEAD:phase3-cloudflare-foundation
          fi
