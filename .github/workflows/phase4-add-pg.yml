name: Phase 4 add pinned pg dependency

on:
  push:
    branches:
      - phase4-cloudflare-neon-connection
    paths:
      - .github/workflows/phase4-add-pg.yml

permissions:
  contents: write

jobs:
  add-pg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase4-cloudflare-neon-connection
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact PostgreSQL driver and update lock
        run: npm install --save-exact pg@8.23.0
      - name: Verify reproducible install
        run: npm ci
      - name: Preserve Phase 2 tests
        run: npm run test:phase2
      - name: Preserve Phase 4 migration contract
        run: npm run test:phase4
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Remove temporary helper and commit dependency lock
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase4-add-pg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/phase4-add-pg.yml
          git diff --cached --check
          git commit -m "Phase 4: pin pg PostgreSQL driver"
          git push origin HEAD:phase4-cloudflare-neon-connection
