name: Phase 4 Neon database verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase4-neon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Preserve Phase 2 and Phase 3 and verify Phase 4 connection contract
        run: npm run verify:phase4
      - name: Verify generated Cloudflare types are current
        run: git diff --exit-code -- worker-configuration.d.ts
      - name: Confirm Hyperdrive binding and no raw database secret
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"binding": "HYPERDRIVE"' wrangler.jsonc
          grep -Fq '"id": "40061acf4dd74d808860c06fe9c2f075"' wrangler.jsonc
          if grep -REi --exclude='package-lock.json' --exclude='*.md' 'postgres(ql)?://[^" ]+:[^" ]+@|DATABASE_URL|NEON_DATABASE_URL' src wrangler.jsonc package.json; then
            echo "Raw database secret/configuration detected in deployable source" >&2
            exit 1
          fi
      - name: Verify preserved Phase 4 database path through current Phase 6 schema
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH="${GITHUB_HEAD_REF//\//-}"
            BASE_URL="https://${BRANCH}-my-budget.positivity864.workers.dev"
          else
            BASE_URL="https://my-budget.positivity864.workers.dev"
          fi

          echo "Verifying preserved Cloudflare → Hyperdrive → Neon path at ${BASE_URL}/ready"
          body_file="$(mktemp)"
          code=""

          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --output "$body_file" --write-out '%{http_code}' "${BASE_URL}/ready" || true)"
            if [ "$code" = "200" ] \
              && grep -Fq '"phase":6' "$body_file" \
              && grep -Fq '"assets":"ready"' "$body_file" \
              && grep -Fq '"database":"ready"' "$body_file" \
              && grep -Fq '"migration":"014"' "$body_file"; then
              echo "PASS preserved Phase 4 database path on attempt ${attempt}"
              cat "$body_file"
              rm -f "$body_file"
              exit 0
            fi
            echo "Waiting for current Phase 6 schema deployment: /ready returned ${code} on attempt ${attempt}"
            sleep 10
          done

          echo "Preserved Phase 4 database path verification failed at ${BASE_URL}/ready" >&2
          echo "Last HTTP status: ${code}" >&2
          cat "$body_file" >&2 || true
          rm -f "$body_file"
          exit 1
