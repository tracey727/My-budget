name: Phase 4 Worker readiness checkpoint

on:
  push:
    branches:
      - phase4-cloudflare-neon-connection

permissions:
  contents: read

jobs:
  readiness-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Worker syntax
        run: node --check src/worker.mjs
      - name: Preserve Phase 2 gate
        run: npm run verify:phase2
      - name: Preserve Phase 3 tests
        run: npm run test:phase3
      - name: Verify Cloudflare deployment bundle dry-run
        run: npm run cf:dry-run
      - name: Phase 4 database and readiness tests
        run: npm run test:phase4
