name: Phase 6 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reproducible install
        run: npm ci

      - name: Preserve Phases 2 through 5 and verify Phase 6 chronologically
        run: npm run verify:phase6

      - name: Confirm Phase 6 migrations remain chronological and scoped
        run: |
          test -f database/migrations/008_phase6_auth_identity_entitlement.sql
          test -f database/migrations/009_phase6_trusted_support_permissions.sql
          ! grep -Eiq 'professional_membership|professional_workspace|delete_current_account' database/migrations/008_phase6_auth_identity_entitlement.sql database/migrations/009_phase6_trusted_support_permissions.sql

      - name: Confirm trusted support keeps read and financial action separate
        run: |
          grep -q 'can_read boolean NOT NULL DEFAULT true' database/migrations/009_phase6_trusted_support_permissions.sql
          grep -q 'can_financial_action boolean NOT NULL DEFAULT false' database/migrations/009_phase6_trusted_support_permissions.sql
          grep -q "WHEN 'read' THEN g.can_read" database/migrations/009_phase6_trusted_support_permissions.sql
          grep -q "WHEN 'financial_action' THEN g.can_financial_action" database/migrations/009_phase6_trusted_support_permissions.sql

      - name: Confirm managed Auth endpoint is configuration-driven
        run: |
          ! grep -Eiq 'ep-[a-z0-9-]+\.neonauth\.' src/worker.mjs wrangler.jsonc

      - name: Confirm protected Budget engine remains untouched
        run: |
          test "$(git hash-object app.js)" = "a86381a76c4676b9d14cbcb1a6b9de842c1cd24c"
