name: Phase 2 baseline verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Source syntax gate
        run: npm run check:source
      - name: Automated model and preservation tests
        run: npm test
      - name: Build supported subscriber runtime
        run: npm run build
      - name: Verify subscriber artifact
        run: node scripts/verify-dist.mjs
      - name: Build preserved React migration destination
        run: npm run build:react-preservation
      - name: Dependency security gate
        run: npm run audit:deps
